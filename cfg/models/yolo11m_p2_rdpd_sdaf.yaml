# RDPD + SDAF — YOLO11m-P2 (4-scale: P2/P3/P4/P5)
# ===================================================================
# Complete original model: RDPD in backbone (P3→P4) + SDAF in neck
# (P3 top-down fusion with external RDPD detail prior).
# SDAF receives 3 inputs:
#   [upsampled P4, backbone P3, RDPD packed output]
# The third input's last channel is used as external detail prior.
# Stride: [4, 8, 16, 32]

nc: 10
scale: m
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00,  512]
  l: [1.00, 1.00,  512]
  x: [1.00, 1.50,  512]

# ── Backbone (RDPD replaces P3→P4 Conv) ──────────────────────────────
backbone:
  - [-1, 1, Conv, [64, 3, 2]]           #  0: 640→320, stride  2
  - [-1, 1, Conv, [128, 3, 2]]          #  1: 320→160, stride  4
  - [-1, 2, C3k2, [256, False, 0.25]]   #  2: 160→160, stride  4  ← P2 lateral

  # RDPD: P3/8 → P4/16  (output = 256 feat + 1 prior = 257 ch)
  - [-1, 1, RDPD, [256]]                #  3: 160→ 80, stride  8  ← RDPD packed

  - [-1, 2, C3k2, [512, False, 0.25]]   #  4:  80→ 80, stride  8  ← P3 lateral

  - [-1, 1, Conv, [512, 3, 2]]          #  5:  80→ 40, stride 16
  - [-1, 2, C3k2, [512, True]]          #  6:  40→ 40, stride 16  ← P4 lateral

  - [-1, 1, Conv, [1024, 3, 2]]         #  7:  40→ 20, stride 32
  - [-1, 2, C3k2, [1024, True]]         #  8:  20→ 20, stride 32
  - [-1, 1, SPPF, [1024, 5]]            #  9:  20→ 20, stride 32
  - [-1, 2, C2PSA, [1024]]              # 10:  20→ 20, stride 32  ← P5 lateral

# ── Neck (FPN+PAN with SDAF at P3, using RDPD external prior) ────────
head:
  # FPN top-down
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]           # 11: P5→40×40
  - [[-1, 6], 1, Concat, [1]]                             # 12: cat P5_up + P4(L6)
  - [-1, 2, C3k2, [512, False]]                           # 13: P4 fusion (P4/16)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]           # 14: P4→80×80
  # SDAF with 3 inputs: [P4_up, P3_backbone, RDPD_packed]
  # RDPD packed output (L3) provides external detail prior
  - [[-1, 4, 3], 1, SDAF, [256, 4]]                      # 15: SDAF P3 fusion (P3/8)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]           # 16: P3→160×160
  - [[-1, 2], 1, Concat, [1]]                             # 17: cat P3_up + P2(L2)
  - [-1, 2, C3k2, [128, False]]                           # 18: P2 fusion (P2/4)

  # PAN bottom-up
  - [-1, 1, Conv, [128, 3, 2]]                            # 19: P2→80×80
  - [[-1, 15], 1, Concat, [1]]                            # 20: cat P2_dn + SDAF_out(L15)
  - [-1, 2, C3k2, [256, False]]                           # 21: P3 output (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]                            # 22: →40×40
  - [[-1, 13], 1, Concat, [1]]                            # 23: cat P3_dn + P4_out(L13)
  - [-1, 2, C3k2, [512, False]]                           # 24: P4 output (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]                            # 25: →20×20
  - [[-1, 10], 1, Concat, [1]]                            # 26: cat P4_dn + P5(L10)
  - [-1, 2, C3k2, [1024, True]]                           # 27: P5 output (P5/32)

  # Detection head — 4-scale: P2, P3, P4, P5
  - [[18, 21, 24, 27], 1, Detect, [nc]]                   # 28: stride [4, 8, 16, 32]
